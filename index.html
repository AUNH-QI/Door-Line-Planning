<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Door Production Planning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
    <style>
        body {
            background-color: #f3f4f6;
            color: #1f2937;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .sidebar-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
        }
        .custom-card {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        /* ปรับแต่ง Tom Select ให้เข้ากับ Light Mode โทนม่วง-ฟ้า */
        .ts-control {
            background-color: #f9fafb !important;
            color: #1f2937 !important;
            border-color: #d1d5db !important;
            border-radius: 0.5rem !important;
            padding: 0.5rem !important;
        }
        .ts-dropdown {
            background-color: #ffffff !important;
            color: #1f2937 !important;
            border-color: #d1d5db !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .ts-dropdown .active {
            background-color: #e0e7ff !important;
            color: #3730a3 !important;
        }
    </style>
</head>
<body class="flex min-h-screen">

    <div class="sidebar-gradient w-20 flex flex-col items-center py-6 text-white shadow-xl fixed h-full z-10">
        <div class="mb-10 cursor-pointer bg-white/20 p-3 rounded-2xl shadow-inner">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </div>
        <div class="flex flex-col gap-6 w-full items-center">
            <div class="p-3 hover:bg-white/10 rounded-xl cursor-pointer transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </div>
            <div class="p-3 bg-white/20 rounded-xl cursor-pointer shadow">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            </div>
            <div class="p-3 hover:bg-white/10 rounded-xl cursor-pointer transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </div>
        </div>
    </div>

    <div class="flex-1 ml-20 p-8">
        
        <div class="custom-card rounded-2xl p-6 mb-8 flex justify-between items-center">
            <div>
                <span class="text-xs font-bold tracking-widest text-indigo-600 uppercase bg-indigo-50 px-3 py-1 rounded-full">PRODUCTION LINE MANAGEMENT</span>
                <h1 class="text-3xl font-extrabold text-gray-800 mt-2">Refrigerator Door Planning</h1>
            </div>
            <div class="flex gap-4">
                <div class="bg-indigo-600 text-white px-5 py-3 rounded-xl shadow-md font-semibold flex items-center gap-2 cursor-pointer hover:bg-indigo-700 transition">
                    <span>🚀 Project Active</span>
                </div>
            </div>
        </div>

        <div class="custom-card rounded-2xl p-6 shadow-lg">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-xl font-bold text-gray-800">ตารางวางแผนการผลิตฝาตู้เย็น</h2>
                    <p class="text-sm text-gray-500">เลือกไลน์การผลิต ค้นหารุ่น และคำนวณแผนอัตโนมัติ</p>
                </div>
                <button onclick="addRow()" class="bg-gradient-to-r from-indigo-600 to-blue-500 hover:from-indigo-700 hover:to-blue-600 text-white px-5 py-2.5 rounded-xl font-semibold shadow-md transition flex items-center gap-2">
                    <span>+ เพิ่มแถวการผลิต</span>
                </button>
            </div>

            <div class="overflow-x-auto">
                <table id="planningTable" class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-200 text-indigo-600 text-sm bg-gray-50/50">
                            <th class="p-3.5 rounded-l-xl">Line</th>
                            <th class="p-3.5">Model (Searchable)</th>
                            <th class="p-3.5">Door (Searchable)</th>
                            <th class="p-3.5 text-center">Round/HR</th>
                            <th class="p-3.5 text-center">Time</th>
                            <th class="p-3.5 text-center">Pallet</th>
                            <th class="p-3.5 text-center">Jig</th>
                            <th class="p-3.5 text-center text-indigo-700 font-bold">Plan (Auto)</th>
                            <th class="p-3.5 text-center rounded-r-xl">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100 text-sm">
                        <tr class="hover:bg-gray-50/80 transition">
                            <td class="p-3">
                                <select class="line-select w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-gray-800 focus:ring-2 focus:ring-indigo-500">
                                    <option value="Line A">Line A</option>
                                    <option value="Line B">Line B</option>
                                    <option value="Line C">Line C</option>
                                </select>
                            </td>
                            <td class="p-3 w-64">
                                <select class="searchable-model w-full">
                                    <option value="">-- ค้นหา Model --</option>
                                    <option value="BM 23 29">BM 23 29</option>
                                    <option value="TM19/21">TM19/21</option>
                                    <option value="BM 35">BM 35</option>
                                    <option value="TM25">TM25</option>
                                </select>
                            </td>
                            <td class="p-3 w-44">
                                <select class="searchable-door w-full">
                                    <option value="">-- เลือก Door --</option>
                                    <option value="F">F</option>
                                    <option value="R">R</option>
                                    <option value="RR">RR</option>
                                    <option value="RL">RL</option>
                                    <option value="FT">FT</option>
                                    <option value="FB">FB</option>
                                    <option value="FR">FR</option>
                                    <option value="FL">FL</option>
                                </select>
                            </td>
                            <td class="p-3 text-center"><input type="number" class="round-hr w-20 bg-gray-50 border border-gray-300 rounded-lg p-2 text-center text-gray-800" value="10" min="0" oninput="calculatePlan(this)"></td>
                            <td class="p-3 text-center"><input type="number" class="time-val w-20 bg-gray-50 border border-gray-300 rounded-lg p-2 text-center text-gray-800" value="8" min="0" oninput="calculatePlan(this)"></td>
                            <td class="p-3 text-center"><input type="number" class="pallet w-20 bg-gray-50 border border-gray-300 rounded-lg p-2 text-center text-gray-800" value="2" min="0"></td>
                            <td class="p-3 text-center"><input type="number" class="jig w-20 bg-gray-50 border border-gray-300 rounded-lg p-2 text-center text-gray-800" value="1" min="0" oninput="calculatePlan(this)"></td>
                            <td class="p-3 font-extrabold text-indigo-600 text-center text-base plan-val">80</td>
                            <td class="p-3 text-center">
                                <button onclick="deleteRow(this)" class="bg-red-100 hover:bg-red-200 text-red-600 px-3 py-1.5 rounded-lg transition font-medium">ลบ</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-6 flex justify-end">
                <button onclick="saveData()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3 rounded-xl shadow-md transition flex items-center gap-2">
                    <span>💾 บันทึกข้อมูลแผนผลิต</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        const modelOptions = [
            {value: 'BM 23 29', text: 'BM 23 29'},
            {value: 'TM19/21', text: 'TM19/21'},
            {value: 'BM 35', text: 'BM 35'},
            {value: 'TM25', text: 'TM25'}
        ];

        const doorOptions = [
            {value: 'F', text: 'F'}, {value: 'R', text: 'R'},
            {value: 'RR', text: 'RR'}, {value: 'RL', text: 'RL'},
            {value: 'FT', text: 'FT'}, {value: 'FB', text: 'FB'},
            {value: 'FR', text: 'FR'}, {value: 'FL', text: 'FL'}
        ];

        // สูตรคำนวณ Plan = Round/HR * Time * Jig
        function calculatePlan(element) {
            const row = element.closest('tr');
            const roundHr = parseFloat(row.querySelector('.round-hr').value) || 0;
            const time = parseFloat(row.querySelector('.time-val').value) || 0;
            const jig = parseFloat(row.querySelector('.jig').value) || 0;
            
            const plan = roundHr * time * jig;
            row.querySelector('.plan-val').textContent = plan.toLocaleString();
        }

        // เพิ่มแถวใหม่
        function addRow() {
            const tbody = document.getElementById('tableBody');
            const newRow = document.createElement('tr');
            newRow.className = "hover:bg-gray-50/80 transition";
            
            newRow.innerHTML = `
                <td class="p-3">
                    <select class="line-select w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-gray-800">
                        <option value="Line A">Line A</option>
                        <option value="Line B">Line B</option>
                        <option value="Line C">Line C</option>
                    </select>
                </td>
                <td class="p-3 w-64">
                    <select class="searchable-model w-full"></select>
                </td>
                <td class="p-3 w-44">
                    <select class="searchable-door w-full"></select>
                </td>
                <td class="p-3 text-center"><input type="number" class="round-hr w-20 bg-gray-50 border border-gray-300 rounded-lg p-2 text-center text-gray-800" value="1" min="0" oninput="calculatePlan(this)"></td>
                <td class="p-3 text-center"><input type="number" class="time-val w-20 bg-gray-50 border border-gray-300 rounded-lg p-2 text-center text-gray-800" value="1" min="0" oninput="calculatePlan(this)"></td>
                <td class="p-3 text-center"><input type="number" class="pallet w-20 bg-gray-50 border border-gray-300 rounded-lg p-2 text-center text-gray-800" value="1" min="0"></td>
                <td class="p-3 text-center"><input type="number" class="jig w-20 bg-gray-50 border border-gray-300 rounded-lg p-2 text-center text-gray-800" value="1" min="0" oninput="calculatePlan(this)"></td>
                <td class="p-3 font-extrabold text-indigo-600 text-center text-base plan-val">1</td>
                <td class="p-3 text-center">
                    <button onclick="deleteRow(this)" class="bg-red-100 hover:bg-red-200 text-red-600 px-3 py-1.5 rounded-lg transition font-medium">ลบ</button>
                </td>
            `;
            
            tbody.appendChild(newRow);
            initSelectPlugins(newRow);
        }

        // ลบแถว
        function deleteRow(button) {
            const row = button.closest('tr');
            if(document.querySelectorAll('#tableBody tr').length > 1) {
                row.remove();
            } else {
                alert("ต้องมีอย่างน้อย 1 แถวในตาราง");
            }
        }

        // เปิดใช้งาน Tom Select (Searchable)
        function initSelectPlugins(scope = document) {
            scope.querySelectorAll('.searchable-model').forEach(el => {
                if (!el.tomselect) {
                    new TomSelect(el, {
                        options: modelOptions,
                        create: true,
                        placeholder: 'ค้นหาหรือเลือก Model...'
                    });
                }
            });

            scope.querySelectorAll('.searchable-door').forEach(el => {
                if (!el.tomselect) {
                    new TomSelect(el, {
                        options: doorOptions,
                        create: true,
                        placeholder: 'เลือก Door...'
                    });
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initSelectPlugins();
        });

        // จำลองการกดปุ่มบันทึกข้อมูล
        function saveData() {
            const rows = document.querySelectorAll('#tableBody tr');
            const data = [];
            rows.forEach(row => {
                data.push({
                    line: row.querySelector('.line-select').value,
                    model: row.querySelector('.searchable-model').value,
                    door: row.querySelector('.searchable-door').value,
                    roundHr: row.querySelector('.round-hr').value,
                    time: row.querySelector('.time-val').value,
                    pallet: row.querySelector('.pallet').value,
                    jig: row.querySelector('.jig').value,
                    plan: row.querySelector('.plan-val').textContent
                });
            });
            console.log("Production Plan Data (Light Mode):", data);
            alert("บันทึกข้อมูลสำเร็จเรียบร้อยแล้ว!");
        }
    </script>
</body>
</html>
