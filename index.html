<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Door Planning - Production Line Management</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6;
            color: #1f2937;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .sidebar-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
        }
        .custom-card {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body class="flex min-h-screen">

    <div class="sidebar-gradient w-20 flex flex-col items-center py-6 text-white shadow-xl fixed h-full z-10">
        <div class="mb-10 cursor-pointer bg-white/20 p-3 rounded-2xl shadow-inner">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </div>
        <div class="flex flex-col gap-6 w-full items-center">
            <div class="p-3 hover:bg-white/10 rounded-xl cursor-pointer transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </div>
            <div class="p-3 bg-white/20 rounded-xl cursor-pointer shadow">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            </div>
            <div class="p-3 hover:bg-white/10 rounded-xl cursor-pointer transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </div>
        </div>
    </div>

    <div class="flex-1 ml-20 p-8">
        
        <div class="custom-card rounded-2xl p-6 mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <span class="text-xs font-bold tracking-widest text-indigo-600 uppercase bg-indigo-50 px-3 py-1 rounded-full">PRODUCTION LINE MANAGEMENT</span>
                <h1 class="text-3xl font-extrabold text-gray-800 mt-2">Daily Door Planning</h1>
            </div>
            <div class="flex items-center gap-2 bg-gray-100 p-1.5 rounded-xl border border-gray-200">
                <button onclick="switchLine('Line A')" id="btn-Line-A" class="line-tab-btn px-4 py-2 rounded-lg font-bold text-sm transition bg-indigo-600 text-white shadow">Line A</button>
                <button onclick="switchLine('Line B')" id="btn-Line-B" class="line-tab-btn px-4 py-2 rounded-lg font-bold text-sm transition text-gray-600 hover:text-indigo-600">Line B</button>
                <button onclick="switchLine('Line C')" id="btn-Line-C" class="line-tab-btn px-4 py-2 rounded-lg font-bold text-sm transition text-gray-600 hover:text-indigo-600">Line C</button>
            </div>
        </div>

        <div class="custom-card rounded-2xl p-6 shadow-lg">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 id="tableTitle" class="text-xl font-bold text-gray-800">ตารางวางแผนการผลิต: Line A</h2>
                    <p class="text-sm text-gray-500" id="tableDesc">รายการรุ่นและประตูตามกำหนดการมาตรฐานของ Line A</p>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table id="planningTable" class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-200 text-indigo-600 text-sm bg-gray-50/50">
                            <th class="p-3.5 rounded-l-xl">Model</th>
                            <th class="p-3.5">Door</th>
                            <th class="p-3.5 text-center">Round/HR</th>
                            <th class="p-3.5 text-center">Time</th>
                            <th class="p-3.5 text-center">Pallet</th>
                            <th class="p-3.5 text-center">Jig</th>
                            <th class="p-3.5 text-center text-indigo-700 font-bold">Plan (Auto)</th>
                            <th class="p-3.5 text-center rounded-r-xl">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100 text-sm">
                    </tbody>
                </table>
            </div>

            <div class="mt-6 flex justify-end">
                <button onclick="saveData()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3 rounded-xl shadow-md transition flex items-center gap-2">
                    <span>💾 บันทึกข้อมูลแผนผลิต</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        // รายการ Model และ Door ของ Line A
        const lineAModels = [
            { model: "620 550 หน้าเรียบ", door: "R" },
            { model: "620 550 ก๊อกน้ำ", door: "R" },
            { model: "636", door: "F" },
            { model: "520 หน้าเรียบ", door: "RR" },
            { model: "520 ก๊อกน้ำ", door: "RR" },
            { model: "520", door: "RL" },
            { model: "G 3 320", door: "F" },
            { model: "G 3 320", door: "R" },
            { model: "G 3 350", door: "F" },
            { model: "G 3 350", door: "R" },
            { model: "T-DOOR US", door: "RR" },
            { model: "T-DOOR US", door: "RL" },
            { model: "T-DOOR US", door: "FR" },
            { model: "T-DOOR US", door: "FL" },
            { model: "T-DOOR HORIZONTAL เรียบ", door: "RR" },
            { model: "T-DOOR HORIZONTAL เรียบ", door: "RL" },
            { model: "T-DOOR HORIZONTAL เรียบ", door: "FR" },
            { model: "T-DOOR HORIZONTAL เรียบ", door: "FL" },
            { model: "T-DOOR HORIZONTAL ก๊อก", door: "RR" },
            { model: "T-DOOR HORIZONTAL ก๊อก", door: "RL" },
            { model: "T-DOOR HORIZONTAL ก๊อก", door: "FR" },
            { model: "T-DOOR HORIZONTAL ก๊อก", door: "FL" },
            { model: "TM 1012", door: "F" },
            { model: "TM 1012", door: "R" }
        ];

        // รายการ Model และ Door ของ Line B
        const lineBModels = [
            { model: "EHRT 2070 NL", door: "F" },
            { model: "EHRT 2070 NL", door: "R" },
            { model: "EHRT 2570 NL", door: "F" },
            { model: "EHRT 2570 NL", door: "R" },
            { model: "Door 5.3 Cu.(159) C", door: "R" },
            { model: "Door 5.3 Cu.(159) F", door: "R" },
            { model: "Door - 6.6 Cu.(199) C", door: "R" },
            { model: "Door - 6.6 Cu.(199) F", door: "R" }
        ];

        // รายการ Model และ Door ของ Line C (อัปเดตตามรูปภาพล่าสุด)
        const lineCModels = [
            { model: "BM 23 29", door: "RR" },
            { model: "BM 23 29", door: "RL" },
            { model: "BM 23 29", door: "FT" },
            { model: "BM 23 29", door: "FB" },
            { model: "TM 19/21", door: "F" },
            { model: "TM 19/21", door: "R" },
            { model: "FUF 14", door: "R" },
            { model: "FUF 22", door: "R" },
            { model: "BM 28 FL FR", door: "FR" },
            { model: "BM 28 FL FR", door: "FL" },
            { model: "TM 14", door: "F" },
            { model: "TM 14", door: "R" }
        ];

        // ข้อมูลเริ่มต้นแยกตาม Line (ล็อกค่าตายตัวทุก Line ไม่ใช้ dropdown)
        let productionData = {
            'Line A': lineAModels.map(item => ({
                model: item.model,
                door: item.door,
                roundHr: 10,
                time: 8,
                pallet: 2,
                jig: 1
            })),
            'Line B': lineBModels.map(item => ({
                model: item.model,
                door: item.door,
                roundHr: 10,
                time: 8,
                pallet: 2,
                jig: 1
            })),
            'Line C': lineCModels.map(item => ({
                model: item.model,
                door: item.door,
                roundHr: 10,
                time: 8,
                pallet: 2,
                jig: 1
            }))
        };

        let currentLine = 'Line A';

        function switchLine(lineName) {
            currentLine = lineName;
            
            document.querySelectorAll('.line-tab-btn').forEach(btn => {
                btn.className = "line-tab-btn px-4 py-2 rounded-lg font-bold text-sm transition text-gray-600 hover:text-indigo-600";
            });
            const activeBtn = document.getElementById(`btn-${lineName.replace(' ', '-')}`);
            activeBtn.className = "line-tab-btn px-4 py-2 rounded-lg font-bold text-sm transition bg-indigo-600 text-white shadow";

            document.getElementById('tableTitle').textContent = `ตารางวางแผนการผลิต: ${lineName}`;
            document.getElementById('tableDesc').textContent = `รายการรุ่นและประตูตามกำหนดการมาตรฐานของ ${lineName}`;

            renderTable();
        }

        function calculatePlan(element) {
            const row = element.closest('tr');
            const roundHr = parseFloat(row.querySelector('.round-hr').value) || 0;
            const time = parseFloat(row.querySelector('.time-val').value) || 0;
            const jig = parseFloat(row.querySelector('.jig').value) || 0;
            
            const plan = roundHr * time * jig;
            row.querySelector('.plan-val').textContent = plan.toLocaleString();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            const items = productionData[currentLine] || [];

            items.forEach(item => {
                addRowData(item);
            });
        }

        function addRowData(data) {
            const tbody = document.getElementById('tableBody');
            const newRow = document.createElement('tr');
            newRow.className = "hover:bg-gray-50/80 transition";
            
            const planVal = (data.roundHr || 0) * (data.time || 0) * (data.jig || 0);

            // ทุก Line ใช้รูปแบบข้อความแสดงผลตายตัวตามรายการมาตรฐาน
            newRow.innerHTML = `
                <td class="p-3 font-medium text-gray-800 model-text">${data.model}</td>
                <td class="p-3 font-medium text-gray-800 door-text">${data.door}</td>
                <td class="p-3 text-center"><input type="number" class="round-hr w-20 bg-gray-50 border border-gray-300 rounded-lg p-2 text-center text-gray-800" value="${data.roundHr}" min="0" oninput="calculatePlan(this)"></td>
                <td class="p-3 text-center"><input type="number" class="time-val w-20 bg-gray-50 border border-gray-300 rounded-lg p-2 text-center text-gray-800" value="${data.time}" min="0" oninput="calculatePlan(this)"></td>
                <td class="p-3 text-center"><input type="number" class="pallet w-20 bg-gray-50 border border-gray-300 rounded-lg p-2 text-center text-gray-800" value="${data.pallet}" min="0"></td>
                <td class="p-3 text-center"><input type="number" class="jig w-20 bg-gray-50 border border-gray-300 rounded-lg p-2 text-center text-gray-800" value="${data.jig}" min="0" oninput="calculatePlan(this)"></td>
                <td class="p-3 font-extrabold text-indigo-600 text-center text-base plan-val">${planVal.toLocaleString()}</td>
                <td class="p-3 text-center text-gray-400">-</td>
            `;
            tbody.appendChild(newRow);
        }

        document.addEventListener('DOMContentLoaded', () => {
            switchLine('Line A');
        });

        function saveData() {
            const rows = document.querySelectorAll('#tableBody tr');
            const currentRowsData = [];
            
            rows.forEach(row => {
                currentRowsData.push({
                    model: row.querySelector('.model-text').textContent,
                    door: row.querySelector('.door-text').textContent,
                    roundHr: parseFloat(row.querySelector('.round-hr').value) || 0,
                    time: parseFloat(row.querySelector('.time-val').value) || 0,
                    pallet: parseFloat(row.querySelector('.pallet').value) || 0,
                    jig: parseFloat(row.querySelector('.jig').value) || 0
                });
            });

            productionData[currentLine] = currentRowsData;
            console.log("Updated Production Plan Data:", productionData);
            alert(`บันทึกข้อมูลแผนผลิตของ ${currentLine} สำเร็จเรียบร้อย!`);
        }
    </script>
</body>
</html>
